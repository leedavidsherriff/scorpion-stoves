<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gareth — your site is live</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#e8eefc; --ink-soft:#a9bbdb; --cream:#0a1a3a; --paper:#0f2249;
  --ember:#ea4a11; --ember-deep:#b8380a; --amber:#ffb37a;
  --line:rgba(255,255,255,.13); --char:#071227;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--font-body);min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
.stage{width:100%;max-width:900px;text-align:center}

.intro{opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s ease}
.intro.in{opacity:1;transform:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin:0 0 8px}
.intro h1{font-family:var(--font-display);font-weight:700;font-size:clamp(23px,4.6vw,38px);line-height:1.1;margin:0 0 16px}

/* browser frame */
.win{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px -25px rgba(0,0,0,.75);opacity:0;transform:translateY(16px) scale(.98);transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1),max-width .8s ease}
.win.in{opacity:1;transform:none}
.chrome{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--char);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px;flex:0 0 auto}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.22);display:block}
.bar{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;text-align:left;min-height:36px}
.bar.go{border-color:var(--ember)}
.lock{width:13px;height:13px;flex:0 0 auto;opacity:0;transition:opacity .3s}
.lock.on{opacity:.75}
.url{font-family:var(--font-body);letter-spacing:.01em;white-space:nowrap;overflow:hidden}
.caret{display:inline-block;width:2px;height:16px;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
.caret.off{display:none}
@keyframes blink{50%{opacity:0}}
.load{height:2px;background:var(--ember);width:0;transition:width .55s ease}

.screen{position:relative;aspect-ratio:16/9;max-height:min(36svh,360px);background:var(--char)}
.screen video,.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.screen .on{opacity:1}

.outro{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease;margin-top:16px}
.outro.in{opacity:1;transform:none}
.outro p{color:var(--ink-soft);font-size:14.5px;margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ember);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:999px;box-shadow:0 14px 34px -12px rgba(234,74,17,.7);transition:transform .18s,background .18s}
.btn:hover{background:var(--ember-deep);transform:translateY(-2px)}
.hint{margin-top:10px;font-size:13px;color:rgba(232,238,252,.45)}
@media(max-width:620px){.bar{font-size:13px;padding:7px 12px}.dots{display:none}}
</style>
<meta name="description" content="scorpionstoves.com — have a look."><meta property="og:type" content="website"><meta property="og:site_name" content="Scorpion Stoves"><meta property="og:locale" content="en_GB"><meta property="og:url" content="https://scorpionstoves.com/welcome.html"><meta property="og:title" content="Gareth — your site is live"><meta property="og:description" content="scorpionstoves.com — have a look."><meta property="og:image" content="https://scorpionstoves.com/og-image.jpg"><meta property="og:image:secure_url" content="https://scorpionstoves.com/og-image.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="A lit log burner in a finished stone fireplace"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Gareth — your site is live"><meta name="twitter:description" content="scorpionstoves.com — have a look."><meta name="twitter:image" content="https://scorpionstoves.com/og-image.jpg"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#0a1a3a"></head>
<body>

<div class="stage">
  <div class="intro" id="intro">
    <p class="eyebrow">Scorpion Stoves</p>
    <h1>Gareth &mdash; this one&rsquo;s yours.</h1>
  </div>

  <div class="win" id="win">
    <div class="chrome">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="bar" id="bar">
        <svg class="lock" id="lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
        <span class="url" id="url"></span><span class="caret" id="caret"></span>
      </span>
    </div>
    <div class="load" id="load"></div>
    <div class="screen">
      <img id="poster" src="./media/poster.jpg" alt="">
      <video id="clip" muted playsinline preload="auto"></video>
    </div>
  </div>

  <div class="outro" id="outro">
    <p>Live now, on your own address.</p>
    <a class="btn" id="go" href="https://scorpionstoves.com/">Open your site</a>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function(){
  var URL_TEXT = 'scorpionstoves.com';
  var CLIP = 'https://d2ol7oe51mr4n9.cloudfront.net/user_3EqnuaqEWb2299IejFDCfj8sKws/f01aad1b-e768-48a3-91ed-a710ed9fcdf2.mp4';
  var intro=document.getElementById('intro'), win=document.getElementById('win'),
      url=document.getElementById('url'), caret=document.getElementById('caret'),
      bar=document.getElementById('bar'), lock=document.getElementById('lock'),
      load=document.getElementById('load'), poster=document.getElementById('poster'),
      clip=document.getElementById('clip'), outro=document.getElementById('outro'),
      hint=document.getElementById('hint');

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  clip.src = CLIP;

  function finish(){
    poster.classList.remove('on');
    clip.classList.add('on');
    var p = clip.play();
    if (p && p.catch) p.catch(function(){ poster.classList.add('on'); clip.classList.remove('on'); });
    outro.classList.add('in');
    var left = 6;
    hint.textContent = 'Taking you there in ' + left + '…';
    var t = setInterval(function(){
      left--;
      if (left <= 0){ clearInterval(t); location.href = 'https://scorpionstoves.com/'; return; }
      hint.textContent = 'Taking you there in ' + left + '…';
    }, 1000);
    ['click','keydown','touchstart','wheel'].forEach(function(ev){
      addEventListener(ev, function(){ clearInterval(t); hint.textContent = ''; }, {once:true, passive:true});
    });
  }

  async function run(){
    if (reduced){
      intro.classList.add('in'); win.classList.add('in');
      url.textContent = URL_TEXT; caret.classList.add('off'); lock.classList.add('on');
      load.style.width='100%'; poster.classList.add('on');
      await wait(300); finish(); return;
    }
    await wait(250);  intro.classList.add('in');
    await wait(650);  win.classList.add('in');
    await wait(700);
    for (var i=0; i<URL_TEXT.length; i++){
      url.textContent += URL_TEXT[i];
      await wait(URL_TEXT[i]==='.' ? 190 : 78);
    }
    await wait(420);
    caret.classList.add('off'); bar.classList.add('go');
    load.style.width = '100%';
    await wait(560);
    lock.classList.add('on'); poster.classList.add('on');
    await wait(520);
    finish();
  }
  run();
})();
</script>
</body>
</html>
